<head>
    <meta charset="utf-8" />
    <title>PolySafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        html { min-height: 100%; background: #0f1115; color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #f1f3f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border: 1px solid #2a2f3a;
            border-radius: 12px;
            background: #171a21;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
        .intro { margin: 8px 0 24px; color: #9ca3af; line-height: 1.5; }
        form { display: grid; gap: 12px; }
        input { display: block; width: 100%; min-height: 48px; border-radius: 8px; font: inherit; }
        input[type=password] { padding: 12px 14px; border: 1px solid #343a46; color: #f1f3f5; background: #11141a; }
        input:focus-visible { outline: 2px solid #8b7cf6; outline-offset: 2px; }
        input[type=submit] { border: 0; padding: 12px; background: #7c6df2; color: white; font-weight: 600; cursor: pointer; }
        input[type=submit]:hover { background: #6d5ee8; }
        input[type=submit]:disabled { opacity: .65; cursor: wait; }
        input[type=file] { padding: 8px; border: 1px solid #343a46; background: #11141a; font-size: 13px; }
        input[type=file]::file-selector-button { margin-right: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: #252a34; color: #f1f3f5; font: inherit; font-weight: 600; cursor: pointer; }
        .status { margin: 16px 0 0; color: #ff8a8a; line-height: 1.5; }
        .status:empty { display: none; }
        noscript { display: block; color: #ff8a8a; line-height: 1.5; }
        @media (max-width: 380px) { main { padding: 24px 20px; } }
    </style>
</head>

<body>
    <main>
        <h1>PolySafe</h1>
        <p class="intro">Encrypt a file into a self-decrypting HTML file.</p>
        <p class="intro" id="password-guidance">Use a long, unique passphrase.</p>
        <noscript>JavaScript is required to encrypt files.</noscript>
        <form action="javascript:;" style="display:none">
            <input type="file" id="file" aria-label="File to encrypt" autofocus>
            <input type="password" id="password" aria-label="Password" placeholder="Password" autocomplete="new-password" aria-describedby="password-guidance" required>
            <input type="password" id="password_repeated" aria-label="Repeat password" placeholder="Repeat password" autocomplete="new-password" aria-describedby="password-guidance" required>
            <input type="submit" value="Encrypt file">
        </form>
        <p class="status" role="status" aria-live="polite"></p>
    </main>
    <script>
        'use strict';

        function getRandomBytes(num) {
            let bytes = new Uint8Array(num);
            window.crypto.getRandomValues(bytes);
            return bytes;
        }

        function readFile(file) {
            return new Uint8Array(new FileReader().readAsArrayBuffer(file));
        }

        function readFile(file) {
            const reader = new FileReader();

            return new Promise((resolve, reject) => {
                reader.onerror = () => {
                    reader.abort();
                    reject(new DOMException('Cannot read input file.'));
                };

                reader.onload = () => {
                    resolve(new Uint8Array(reader.result));
                };
                reader.readAsArrayBuffer(file);
            });
        };

        function preprendFilename(filename, data_bytes) {
            const filename_bytes = new TextEncoder('utf-8').encode(filename + '/');
            const combined_bytes = new Uint8Array(filename_bytes.length + data_bytes.length);
            combined_bytes.set(filename_bytes, 0);
            combined_bytes.set(data_bytes, filename_bytes.length);
            return combined_bytes;
        }

        function deriveKey(password, salt) {
            const passwordBytes = new TextEncoder('utf-8').encode(password);
            return window.crypto.subtle.importKey(
                'raw',
                passwordBytes, {
                    name: 'PBKDF2',
                },
                false,
                ['deriveKey']
            ).then(function (key) {
                return window.crypto.subtle.deriveKey({
                        name: 'PBKDF2',
                        salt,
                        iterations: 600000,
                        hash: {
                            name: 'SHA-256'
                        }
                    },
                    key, {
                        name: 'AES-GCM',
                        length: 128
                    },
                    false,
                    ['encrypt']
                )
            });
        }

        function encrypt(key, iv, bytes) {
            return window.crypto.subtle.encrypt({
                name: 'AES-GCM',
                length: 128,
                iv
            }, key, bytes);
        }

        /*
        MIT LICENSE
        Copyright 2011 Jon Leighton
        Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:
        The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.
        THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
        */

        function base64ArrayBuffer(arrayBuffer) {
            let base64 = '';
            const encodings = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

            const bytes = new Uint8Array(arrayBuffer);
            const byteLength = bytes.byteLength;
            const byteRemainder = byteLength % 3;
            const mainLength = byteLength - byteRemainder;

            let a, b, c, d;
            let chunk;

            // Main loop deals with bytes in chunks of 3
            for (var i = 0; i < mainLength; i = i + 3) {
                // Combine the three bytes into a single integer
                chunk = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];

                // Use bitmasks to extract 6-bit segments from the triplet
                a = (chunk & 16515072) >> 18; // 16515072 = (2^6 - 1) << 18
                b = (chunk & 258048) >> 12; // 258048   = (2^6 - 1) << 12
                c = (chunk & 4032) >> 6; // 4032     = (2^6 - 1) << 6
                d = chunk & 63; // 63       = 2^6 - 1

                // Convert the raw binary segments to the appropriate ASCII encoding;
                base64 += encodings[a] + encodings[b] + encodings[c] + encodings[d];
            }

            // Deal with the remaining bytes and padding
            if (byteRemainder == 1) {
                chunk = bytes[mainLength];

                a = (chunk & 252) >> 2; // 252 = (2^6 - 1) << 2

                // Set the 4 least significant bits to zero
                b = (chunk & 3) << 4; // 3   = 2^2 - 1

                base64 += encodings[a] + encodings[b] + '==';
            } else if (byteRemainder == 2) {
                chunk = (bytes[mainLength] << 8) | bytes[mainLength + 1];

                a = (chunk & 64512) >> 10; // 64512 = (2^6 - 1) << 10
                b = (chunk & 1008) >> 4; // 1008  = (2^6 - 1) << 4

                // Set the 2 least significant bits to zero
                c = (chunk & 15) << 2; // 15    = 2^4 - 1

                base64 += encodings[a] + encodings[b] + encodings[c] + '=';
            }

            return base64;
        }

        function serialize(salt, iv, cipher_buffer) {
            const payload = JSON.stringify({
                salt: Array.prototype.slice.call(salt),
                iv: Array.prototype.slice.call(iv),
                encrypted: base64ArrayBuffer(cipher_buffer)
            });
            const decryptor_html = DECRYPTOR_TEMPLATE.replace('{{___PAYLOAD___}}', payload);
            return new TextEncoder('utf-8').encode(decryptor_html);
        }

        function download(filename, buffer) {
            const a = document.createElement('a');
            a.style = 'display: none';
            document.body.appendChild(a);
            const blob = new Blob([buffer], {
                type: 'application/octet-stream'
            });
            const url = window.URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function runEncrypt() {
            const status = document.querySelector('.status');
            status.textContent = '';

            if (!window.crypto || !window.crypto.subtle) {
                status.textContent = 'Your browser does not support the Web Crypto API.';
                return;
            }

            const file = document.getElementById('file').files[0];
            if (!file) {
                status.textContent = 'Select a file first.';
                return;
            }
            const password = document.getElementById('password').value;
            if (password.length === 0) {
                status.textContent = 'Enter a long, unique passphrase before encrypting.';
                return;
            }
            if (password != document.getElementById('password_repeated').value) {
                status.textContent = 'Passwords must match.';
                return;
            }

            const encryptButton = document.querySelector('input[type=submit]');
            encryptButton.disabled = true;
            encryptButton.value = 'Encrypting…';

            const salt = getRandomBytes(16);
            const iv = getRandomBytes(16);

            readFile(file)
                .then(file_bytes => preprendFilename(file.name, file_bytes))
                .then(payload_bytes => deriveKey(password, salt)
                    .then(key => encrypt(key, iv, payload_bytes)))
                .then(buffer => serialize(salt, iv, buffer))
                .then(buffer => download(file.name + '.html', buffer))
                .catch(e => {
                    status.textContent = 'Encryption failed: ' + e.message;
                })
                .finally(() => {
                    encryptButton.disabled = false;
                    encryptButton.value = 'Encrypt file';
                });
        }

        document.querySelector('form').addEventListener('submit', e => {
            e.preventDefault();
            runEncrypt();
        });
        document.querySelector('form').style.display = 'grid';

        const DECRYPTOR_TEMPLATE =
            `
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>PolySafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>${document.querySelector('style').textContent}</style>
</head>

<body>
    <main>
        <h1>PolySafe</h1>
        <p class="intro">Enter the password to decrypt this file.</p>
        <noscript>JavaScript is required to decrypt files.</noscript>
        <form action="javascript:;" style="display:none">
            <input id="password" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password" autofocus>
            <input type="submit" value="Decrypt file">
        </form>
        <p class="status" role="status" aria-live="polite"></p>
    </main>
    <script id="data" type="application/json">
        {{___PAYLOAD___}}
    <\/script>
    <script>
        if (window.crypto && !window.crypto.subtle && window.crypto.webkitSubtle) {
            window.crypto.subtle = window.crypto.webkitSubtle;
        }

        function base64ToArray(base64) {
            return new Uint8Array(atob(base64).split('').map(function (c) {
                return c.charCodeAt(0);
            }));
        }

        function deriveKey(password, salt) {
            var passwordBytes = new TextEncoder('utf-8').encode(password);

            return window.crypto.subtle.importKey(
                'raw',
                passwordBytes, {
                    name: 'PBKDF2'
                },
                false,
                ['deriveKey']
            ).then(function (key) {
                return window.crypto.subtle.deriveKey({
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 600000,
                        hash: {
                            name: 'SHA-256'
                        }
                    },
                    key, {
                        name: 'AES-GCM',
                        length: 128
                    },
                    false,
                    ['decrypt']
                )
            });
        }

        function decrypt(key, iv, bytes) {
            return window.crypto.subtle.decrypt({
                name: 'AES-GCM',
                length: 128,
                iv: iv
            }, key, bytes);
        }

        function extractDecryptedFile(buffer) {
            var bytes = new Uint8Array(buffer);
            var slash_pos = Array.prototype.indexOf.call(bytes, '/'.charCodeAt(0));
            if (slash_pos == -1) {
                throw 'Decrypted data is corrupted';
            } else {
                var name = new TextDecoder('utf-8').decode(new Uint8Array(Array.prototype.slice.call(bytes, 0, slash_pos)));
                var content = new Uint8Array(Array.prototype.slice.call(bytes, slash_pos + 1));
                return {
                    name: name,
                    content: content
                };
            }
        }

        function download(file) {
            var a = document.createElement('a');
            a.style = 'display: none';
            document.body.appendChild(a);
            var blob = new Blob([file.content]);
            var url = window.URL.createObjectURL(blob);
            a.href = url;
            a.download = file.name;
            a.click();
            setTimeout(function () {
                window.URL.revokeObjectURL(url);
            }, 10000);
        }

        function runDecrypt() {
            var status = document.querySelector('.status');
            status.textContent = '';

            if (!window.crypto || !window.crypto.subtle) {
                status.textContent = 'Your browser does not support the Web Crypto API.';
                return;
            }

            var decryptButton = document.querySelector('input[type=submit]');
            decryptButton.disabled = true;
            decryptButton.value = 'Decrypting…';

            setTimeout(function () {
                var data = JSON.parse(document.getElementById('data').textContent);
                var salt = new Uint8Array(data.salt);
                var iv = new Uint8Array(data.iv);
                var encrypted = base64ToArray(data.encrypted);

                var password = document.querySelector('input[type=password]').value;
                deriveKey(password, salt)
                    .then(function (key) {
                        return decrypt(key, iv, encrypted);
                    })
                    .catch(function () {
                        throw 'Wrong password or corrupted file.';
                    })
                    .then(extractDecryptedFile)
                    .then(download)
                    .catch(function (e) {
                        status.textContent = 'Decryption failed: ' + e;
                    })
                    .then(function () {
                        decryptButton.disabled = false;
                        decryptButton.value = 'Decrypt file';
                    });
            }, 0);
        }

        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            runDecrypt();
        });
        document.querySelector('form').style.display = 'grid';
    <\/script>
</body>

</html>`;
    </script>
</body>

</html>
